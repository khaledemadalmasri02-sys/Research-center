name = "research"
compatibility_date = "2025-04-01"
main = "src/index.ts"
workers_dev = false
account_id = "1c6980a08850bab43d5a92964a29a37f"

# Static Assets: Cloudflare serves the SPA directly (cached at the edge).
# Only /api/* requests are sent to the Worker; everything else (HTML, JS, CSS,
# images, SPA client-side routes) is handled by the assets layer, including the
# single-page-application fallback to index.html.
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[kv_namespaces]]
binding = "SESSIONS"
id = "126b47b7084343ca8fe4510a9b33c800"

[[d1_databases]]
binding = "DB"
database_name = "mednexus-research"
database_id = "83132b57-3fe6-4bec-bc90-b782fddcc2bc"

[vars]
# API_BACKEND_URL is NOT declared here: the deploy script (`pnpm research`)
# sets it as a Worker SECRET from the live cloudflared tunnel URL. A var and a
# secret cannot share a binding name, so it must live only in the secret.

[env.production]
name = "research"
logpush = true
route = "research-center.fit/*"

[env.production.assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[env.production.kv_namespaces]]
binding = "SESSIONS"
id = "126b47b7084343ca8fe4510a9b33c800"

[[env.production.d1_databases]]
binding = "DB"
database_name = "mednexus-research"
database_id = "83132b57-3fe6-4bec-bc90-b782fddcc2bc"

[env.production.vars]
# API_BACKEND_URL is set as a Worker SECRET by the deploy script
# (`pnpm research`) from the live cloudflared tunnel URL. It must NOT also
# appear here (a var and a secret cannot share a binding name).

# The Worker is now a pure static + /api reverse-proxy to the Postgres
# api-server, so it no longer needs S3 / session / GROQ secrets itself —
# those live on the api-server (MinIO + Postgres are local to it).

