    <!--
      Pre-hydration theme + density + RTL bootstrap. Runs before React mounts
      to avoid a flash of wrong theme / layout direction. Mirrors the keys
      used by next-themes (class on <html>) and the density persisted by
      the desktop shell.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var systemDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          var theme = stored || (systemDark ? "dark" : "light");
          if (theme === "dark") document.documentElement.classList.add("dark");
          else document.documentElement.classList.remove("dark");

          var density = localStorage.getItem("app-density") || "comfortable";
          document.documentElement.setAttribute("data-density", density);

          var lang = localStorage.getItem("i18nextLng") || navigator.language || "en";
          var rtl = lang === "ar" || lang === "he" || lang === "fa" || lang === "ur";
          document.documentElement.setAttribute("dir", rtl ? "rtl" : "ltr");
          document.documentElement.setAttribute("lang", lang);
        } catch (_) {
          /* localStorage may be unavailable (private mode, SSR); ignore. */
        }
      })();
    </script>
