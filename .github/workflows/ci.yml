name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test-research:
    name: research (Worker)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: research/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc -p tsconfig.json --noEmit
      - name: Schema consistency check
        run: npx tsx scripts/check-schema.ts
      - name: Test
        run: npx vitest run
      # P1.20: build the SPA in CI to confirm the build pipeline is
      # green. The Worker serves research/public/ via the ASSETS
      # binding, so this is what gets deployed. We don't commit the
      # build artefacts (see .gitignore); deploy scripts run the same
      # build. This job catches "build is broken on main" early.
      - name: Install frontend deps + build SPA
        working-directory: artifacts/research-data
        run: pnpm install --frozen-lockfile && BASE_PATH=/ pnpm run build
        env:
          BASE_PATH: /

  test-api-server:
    name: api-server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build @workspace/db (declarations)
        run: pnpm -F @workspace/db exec tsc -p tsconfig.json
      - name: Typecheck
        run: pnpm -F @workspace/api-server typecheck
      - name: Test (with coverage)
        # Requires Docker on the runner for the Postgres testcontainer.
        run: pnpm -F @workspace/api-server test:coverage

  codegen-check:
    name: OpenAPI codegen drift check (P1.16)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      # Run orval in a sandbox, diff against the committed
      # lib/api-client-react/src/generated/. Fails the build if the
      # OpenAPI spec has changed without a matching codegen run.
      - name: codegen:check
        run: pnpm -F @workspace/api-spec codegen:check
