name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test-research:
    name: research (Worker)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: research/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc -p tsconfig.json --noEmit
      - name: Schema consistency check
        run: npx tsx scripts/check-schema.ts
      - name: Test
        run: npx vitest run

  test-api-server:
    name: api-server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm -F @workspace/api-server typecheck
      - name: Test (with coverage)
        # Requires Docker on the runner for the Postgres testcontainer.
        run: pnpm -F @workspace/api-server test:coverage
