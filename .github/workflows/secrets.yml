name: Secret Scan

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    # Weekly scan of all branches, including history
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  gitleaks-history:
    name: Scan git history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      # gitleaks/gitleaks-action was archived upstream (v2 is the last release
      # and the action itself is unmaintained), so it is no longer a usable
      # dependency. Install the released binary directly instead — same
      # version as the working-tree job below, pinned by tag.
      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan git history
        run: gitleaks detect --no-banner --config .gitleaks.toml --source . --redact --verbose

  gitleaks-working-tree:
    name: Scan working tree + untracked
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
      - name: Scan uncommitted
        run: gitleaks detect --no-banner --config .gitleaks.toml --source . --uncommitted --redact --verbose
