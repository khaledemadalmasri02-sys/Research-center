name: Secret Scan

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    # Weekly scan of all branches, including history
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  gitleaks-history:
    name: Scan git history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  gitleaks-working-tree:
    name: Scan working tree + untracked
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
      - name: Scan uncommitted
        run: gitleaks detect --no-banner --config .gitleaks.toml --source . --uncommitted --redact --verbose