version: 2
updates:
  # ----------------------------------------------------------------------
  # pnpm workspace
  # ----------------------------------------------------------------------
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    # Group patch and minor updates into single PRs so the lockfile moves
    # at most a few times a week. Major updates are kept separate so a
    # human reviews the breaking-change notes.
    groups:
      pnpm-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      pnpm-major:
        applies-to: version-updates
        update-types:
          - "major"
    # Only one open PR per ecosystem at a time. Otherwise the queue
    # piles up when weekly checks discover multiple outdated packages.
    open-pull-requests-limit: 5
    # Rebase on the latest main every time so we don't drag stale
    # branches after the lockfile moves in main.
    rebase-strategy: "auto"
    labels:
      - "dependencies"
      - "pnpm"
    commit-message:
      prefix: "chore(deps)"
    # Genuine exclusions only. This list used to contain a catch-all
    # `{ dependency-name: "*", versions: ["*"] }` rule, which matched every
    # dependency and silently disabled npm updates for the whole repository —
    # Dependabot was configured but inert.
    #
    # Deliberately NOT excluded:
    #   * the two `overrides:` pins in pnpm-workspace.yaml
    #     (`@esbuild-kit/esm-loader`, `esbuild`). Dependabot proposing an
    #     esbuild bump is *desired* — it is the signal that the override can
    #     be relaxed. The override stays authoritative either way.
    ignore:
      # Hand-maintained ambient type packages: they track the runtime major
      # (Node, React) and are bumped deliberately, not weekly.
      - dependency-name: "@types/*"
      # Workspace-local packages have no published versions.
      - dependency-name: "@workspace/*"

  # ----------------------------------------------------------------------
  # GitHub Actions versions
  # ----------------------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 3
    rebase-strategy: "auto"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"
    # Workflow refs are pinned to full commit SHAs (see the `uses:` lines in
    # .github/workflows/*.yml), so Dependabot's SHA-bump PRs are the only
    # mechanism that can move them forward safely.
