openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Patient Research Data Collection API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: patients
    description: Patient records operations
  - name: Storage
    description: Object storage upload and serving endpoints.
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /patients:
    get:
      operationId: listPatients
      tags: [patients]
      summary: List all patients
      description: Returns all patient records
      parameters:
        - name: search
          in: query
          schema:
            type: ["string", "null"]
        - name: sex
          in: query
          schema:
            type: ["string", "null"]
        - name: collectionType
          in: query
          schema:
            type: ["string", "null"]
        - name: limit
          in: query
          schema:
            type: ["integer", "null"]
        - name: offset
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: List of patients
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListPatientsResponse"

    post:
      operationId: createPatient
      tags: [patients]
      summary: Create a patient record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePatientBody"
      responses:
        "201":
          description: Patient created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patient"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /patients/stats:
    get:
      operationId: getPatientStats
      tags: [patients]
      summary: Get patient statistics
      description: Returns aggregated stats for dashboard
      responses:
        "200":
          description: Statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientStats"

  /patients/{id}:
    get:
      operationId: getPatient
      tags: [patients]
      summary: Get a single patient
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Patient record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patient"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      operationId: updatePatient
      tags: [patients]
      summary: Update a patient record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePatientBody"
      responses:
        "200":
          description: Updated patient
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patient"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      operationId: deletePatient
      tags: [patients]
      summary: Delete a patient record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /patients/batch:
    post:
      operationId: batchImportPatients
      tags: [patients]
      summary: Batch import patients with image URL processing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [patients]
              properties:
                patients:
                  type: array
                  items:
                    $ref: "#/components/schemas/CreatePatientBody"
      responses:
        "200":
          description: Batch import completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        errors:
                          type: array
                          items:
                            type: string
                        updatedImagePaths:
                          type: array
                          items:
                            type: string
                  processed:
                    type: integer
                  failed:
                    type: integer
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /storage/public-objects/{filePath}:
    get:
      tags: [Storage]
      operationId: getPublicObject
      summary: Serve a public asset
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object content.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: File not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /storage/ensure-bucket:
    post:
      tags: [Storage]
      operationId: ensureBucket
      summary: Ensure storage bucket exists
      responses:
        '200':
          description: Bucket is ready.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '404':
          description: Bucket not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /storage/images/import:
    post:
      tags: [Storage]
      operationId: importImageFromUrl
      summary: Import an image from a URL into storage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportImageFromUrlRequest'
      responses:
        '200':
          description: Image imported successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportImageFromUrlResponse'
        '400':
          description: Invalid request or URL does not point to an image.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /storage/images/by-patient:
    post:
      tags: [Storage]
      operationId: importImageByPatient
      summary: Import an image from a URL and associate with a patient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportImageByPatientRequest'
      responses:
        '200':
          description: Image imported successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportImageByPatientResponse'
        '400':
          description: Invalid request or URL does not point to an image.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  
  /storage/images/by-patient/{patientId}:
    get:
      tags: [Storage]
      operationId: getPatientImages
      summary: List all images associated with a patient ID
      parameters:
        - name: patientId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Images found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientImagesResponse'
        '500':
          description: Server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  
  /storage/images/search:
    post:
      tags: [Storage]
      operationId: searchImages
      summary: Search for images by identifier or filename
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                identifier:
                  type: string
                  description: Image identifier to search (e.g., patient ID, study ID)
                patientId:
                  type: string
                  description: Existing patient ID to attach images to
                filename:
                  type: string
                  description: Filename pattern to search for
              additionalProperties: false
      responses:
        '200':
          description: Images found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchImagesResponse'
        '404':
          description: No images found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  
  /patients/{id}/images:
    post:
      tags: [patients]
      operationId: attachPatientImageById
      summary: Attach existing images to a patient by image ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [imageId]
              properties:
                imageId:
                  type: string
                  description: The ID to search for images (e.g., patient ID, study ID)
      responses:
        '200':
          description: Image attached to patient.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'
        '404':
          description: Patient or image not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  
  /patients/batch-import-images:
    post:
      tags: [patients]
      operationId: batchImportImages
      summary: Batch upload images from URLs and attach to a patient record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [patientId, imageUrls]
              properties:
                patientId:
                  type: string
                  description: Patient ID to attach images to
                imageUrls:
                  type: array
                  items:
                    type: string
                    format: uri
                  description: List of image URLs to download and upload
      responses:
        '200':
          description: Images imported successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  uploaded:
                    type: integer
                    description: Number of images successfully uploaded
                  failed:
                    type: integer
                    description: Number of failed uploads
                  failedUrls:
                    type: array
                    items:
                      type: string
                  patient:
                    $ref: '#/components/schemas/Patient'
        '404':
          description: Patient not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  
  /analysis/datasets:
    get:
      operationId: listAnalysisDatasets
      tags: [analysis]
      summary: List my analysis datasets
      responses:
        "200":
          description: Datasets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AnalysisDatasetSummary"
    post:
      operationId: importAnalysisDataset
      tags: [analysis]
      summary: Upload a dataset (CSV/XLSX/SAV)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                name:
                  type: ["string", "null"]
                format:
                  type: ["string", "null"]
              required:
                - file
      responses:
        "201":
          description: Created dataset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisDatasetImported"

  /analysis/datasets/from-query:
    post:
      operationId: buildAnalysisDatasetFromQuery
      tags: [analysis]
      summary: Build a dataset from existing patient records
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FromQueryBody"
      responses:
        "201":
          description: Created dataset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisDatasetImported"

  /analysis/datasets/{id}:
    get:
      operationId: getAnalysisDataset
      tags: [analysis]
      summary: Get dataset meta, variables, and preview rows
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Dataset detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisDatasetDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /analysis/datasets/{id}/variables:
    patch:
      operationId: updateAnalysisVariables
      tags: [analysis]
      summary: Update variable metadata (measure, labels, missing)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/VariableUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean

  /analysis/datasets/{id}/analyze:
    post:
      operationId: analyzeDataset
      tags: [analysis]
      summary: Run a statistical analysis
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyzeBody"
      responses:
        "201":
          description: Analysis result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisResult"
        "400":
          description: Invalid analysis request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /analysis/runs/{id}:
    get:
      operationId: getAnalysisRun
      tags: [analysis]
      summary: Get a saved analysis run
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisRun"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /analysis/datasets/{id}/export:
    post:
      operationId: exportAnalysisDataset
      tags: [analysis]
      summary: Export dataset to SAV/CSV/XLSX
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportBody"
      responses:
        "200":
          description: File download
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

  /analysis/runs/{id}/export:
    post:
      operationId: exportAnalysisRun
      tags: [analysis]
      summary: Export an analysis result to CSV
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportBody"
      responses:
        "200":
          description: CSV download
          content:
            text/csv:
              schema:
                type: string

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    Patient:
      type: object
      properties:
        id:
          type: integer
        collectionName:
          type: ["string", "null"]
        collectionDate:
          type: ["string", "null"]
        collectionType:
          type: ["string", "null"]
        patientId:
          type: string
        patientName:
          type: string
        age:
          type: ["integer", "null"]
        sex:
          type: ["string", "null"]
        dateOfVisit:
          type: ["string", "null"]
        chiefComplaint:
          type: ["string", "null"]
        vitalSigns:
          type: ["string", "null"]
        historyTrauma:
          type: ["string", "null"]
        mechanismOfInjuryAndLocalisation:
          type: ["string", "null"]
        signsAndSymptomsTrauma:
          type: ["string", "null"]
        historyMedical:
          type: ["string", "null"]
        signsAndSymptomsMedical:
          type: ["string", "null"]
        riskFactors:
          type: ["string", "null"]
        provisionalDiagnosis:
          type: ["string", "null"]
        radiologyImageFilePathOrLink:
          type: ["string", "null"]
        radiologyImages:
          type: ["string", "null"]
        emergencyReport:
          type: ["string", "null"]
        aiPredictionOutput:
          type: ["string", "null"]
        finalConfirmedDiagnosisAr:
          type: ["string", "null"]
        finalConfirmedDiagnosis:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - patientId
        - patientName
        - createdAt
        - updatedAt

    CreatePatientBody:
      type: object
      properties:
        collectionName:
          type: ["string", "null"]
        collectionDate:
          type: ["string", "null"]
        collectionType:
          type: ["string", "null"]
        patientId:
          type: string
        patientName:
          type: string
        age:
          type: ["integer", "null"]
        sex:
          type: ["string", "null"]
        dateOfVisit:
          type: ["string", "null"]
        chiefComplaint:
          type: ["string", "null"]
        vitalSigns:
          type: ["string", "null"]
        historyTrauma:
          type: ["string", "null"]
        mechanismOfInjuryAndLocalisation:
          type: ["string", "null"]
        signsAndSymptomsTrauma:
          type: ["string", "null"]
        historyMedical:
          type: ["string", "null"]
        signsAndSymptomsMedical:
          type: ["string", "null"]
        riskFactors:
          type: ["string", "null"]
        provisionalDiagnosis:
          type: ["string", "null"]
        radiologyImageFilePathOrLink:
          type: ["string", "null"]
        radiologyImages:
          type: ["string", "null"]
        emergencyReport:
          type: ["string", "null"]
        aiPredictionOutput:
          type: ["string", "null"]
        finalConfirmedDiagnosisAr:
          type: ["string", "null"]
        finalConfirmedDiagnosis:
          type: ["string", "null"]
        imageId:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        required:
        - patientId
        - patientName

    UpdatePatientBody:
      type: object
      properties:
        collectionName:
          type: ["string", "null"]
        collectionDate:
          type: ["string", "null"]
        collectionType:
          type: ["string", "null"]
        patientId:
          type: ["string", "null"]
        patientName:
          type: ["string", "null"]
        age:
          type: ["integer", "null"]
        sex:
          type: ["string", "null"]
        dateOfVisit:
          type: ["string", "null"]
        chiefComplaint:
          type: ["string", "null"]
        vitalSigns:
          type: ["string", "null"]
        historyTrauma:
          type: ["string", "null"]
        mechanismOfInjuryAndLocalisation:
          type: ["string", "null"]
        signsAndSymptomsTrauma:
          type: ["string", "null"]
        historyMedical:
          type: ["string", "null"]
        signsAndSymptomsMedical:
          type: ["string", "null"]
        riskFactors:
          type: ["string", "null"]
        provisionalDiagnosis:
          type: ["string", "null"]
        radiologyImageFilePathOrLink:
          type: ["string", "null"]
        radiologyImages:
          type: ["string", "null"]
        emergencyReport:
          type: ["string", "null"]
        aiPredictionOutput:
          type: ["string", "null"]
        finalConfirmedDiagnosisAr:
          type: ["string", "null"]
        finalConfirmedDiagnosis:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]

    ListPatientsResponse:
      type: object
      properties:
        patients:
          type: array
          items:
            $ref: "#/components/schemas/Patient"
        total:
          type: integer
      required:
        - patients
        - total

    PatientStats:
      type: object
      properties:
        total:
          type: integer
        maleCount:
          type: integer
        femaleCount:
          type: integer
        recentCount:
          type: integer
        diagnosisCounts:
          type: array
          items:
            $ref: "#/components/schemas/DiagnosisCount"
        ageBrackets:
          type: array
          items:
            $ref: "#/components/schemas/AgeBracket"
        collectionTypeCounts:
          type: array
          items:
            $ref: "#/components/schemas/CollectionTypeCount"
      required:
        - total
        - maleCount
        - femaleCount
        - recentCount
        - diagnosisCounts
        - ageBrackets
        - collectionTypeCounts

    DiagnosisCount:
      type: object
      properties:
        diagnosis:
          type: string
        count:
          type: integer
      required:
        - diagnosis
        - count

    AgeBracket:
      type: object
      properties:
        bracket:
          type: string
        count:
          type: integer
      required:
        - bracket
        - count

    CollectionTypeCount:
      type: object
      properties:
        type:
          type: string
        count:
          type: integer
      required:
        - type
        - count

    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
        size:
          type: integer
          minimum: 1
        contentType:
          type: string
          minLength: 1

    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
          format: uri
        objectPath:
          type: string
        metadata:
          $ref: '#/components/schemas/UploadUrlRequest'

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string

    ImportImageFromUrlRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
        filename:
          type: string

    ImportImageFromUrlResponse:
      type: object
      required: [objectPath, contentType]
      properties:
        objectPath:
          type: string
        contentType:
          type: string

    ImportImageByPatientRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
        filename:
          type: string
        patientId:
          type: string

    ImportImageByPatientResponse:
      type: object
      required: [objectPath, patientImages]
      properties:
        objectPath:
          type: string
        patientImages:
          type: array
          items:
            type: string

    PatientImagesResponse:
      type: object
      required: [patientId, images]
      properties:
        patientId:
          type: string
        images:
          type: array
          items:
            type: string

    SearchImagesResponse:
      type: object
      required: [objectPath]
      properties:
        objectPath:
          type: string
        patientImages:
          type: array
          items:
            type: string
        attachmentPatientId:
          type: string

    AnalysisVariable:
      type: object
      properties:
