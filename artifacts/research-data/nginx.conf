server {
    listen 3003;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://api-server:3004/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml application/xml+rss text/x-component application/vnd.ms-fontobject font-ttf font-opentype image/svg+xml image/vnd.microsoft.icon image/x-icon image/bmp image/webp audio/mpeg audio/wav audio/ogg video/mp4 video/webm video/mpeg video/ogg application/pdf image/jpeg image/png image/gif image/svg+xml image/tiff image/webp image/x-icon font/woff font/woff2 font/ttf font/eot