kind = "web"
previewPath = "/"
title = "Patient Research Data Collection"
version = "1.0.0"
id = "artifacts/research-data"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19223

[services.development]
run = "pnpm --filter @workspace/research-data run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/research-data", "run", "build" ]
serve = "static"
publicDir = "artifacts/research-data/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19223"
BASE_PATH = "/"
