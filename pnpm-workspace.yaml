# ============================================================================
# SECURITY: Minimum release age for npm packages (supply-chain attack defense)
# ============================================================================
#
# This setting requires that any npm package version must have been published
# for at least 1 day (1440 minutes) before pnpm will allow installing it.
# This is a critical defense against supply-chain attacks. In most cases,
# malicious npm releases are discovered and pulled within hours, so a 1-day
# delay provides a strong safety buffer.
#
# DO NOT DISABLE THIS SETTING. Removing or setting it to 0 is considered
# extremely dangerous and leaves the entire workspace vulnerable to supply-
# chain attacks, which have been the #1 vector for npm ecosystem compromises.
#
# If you absolutely need to install a package before the 1-day window has
# passed (e.g. an urgent security bugfix), you can add it to the
# `minimumReleaseAgeExclude` allowlist below. Only consider doing this for
# packages released by trusted organizations with an impeccable security
# posture (e.g. react from Meta, typescript from Microsoft). Even then,
# remove the exclusion once the 1-day window has passed.
#
# Example:
#   minimumReleaseAgeExclude:
#     - react
#     - typescript
#
# ============================================================================
minimumReleaseAge: 1440

packages:
  - artifacts/*
  - lib/*
  - lib/integrations/*
  - scripts
  - research

catalog:
  "@tailwindcss/vite": ^4.1.14
  "@tanstack/react-query": ^5.90.21
  "@tanstack/react-table": ^8.21.3
  "@tanstack/react-virtual": ^3.13.12
  "@types/node": ^25.3.3
  "@types/pg": ^8.6.0
  "@types/react": ^19.2.0
  "@types/react-dom": ^19.2.0
  "@vitejs/plugin-react": ^5.0.4
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  drizzle-orm: ^0.45.1
  framer-motion: ^12.23.24
  lucide-react: ^0.545.0
  "@aws-sdk/client-s3": ^3.600.0
  "@aws-sdk/s3-request-presigner": ^3.600.0
  "@aws-sdk/credential-providers": ^3.300.0
  # Must be this exact version because expo requires it
  react: 19.1.0
  # Must be this exact version because expo requires it
  react-dom: 19.1.0
  tailwind-merge: ^3.3.1
  tailwindcss: ^4.1.14
  tsx: ^4.23.0
  vite: ^7.3.6
  vitest: ^2.1.9
  zod: ^4.4.3

autoInstallPeers: false

onlyBuiltDependencies:
  - "@swc/core"
  - cpu-features
  - esbuild
  - msw
  - protobufjs
  - ssh2
  - unrs-resolver

# ============================================================================
# Platform-aware native binaries
# ============================================================================
#
# esbuild, rollup, lightningcss, @tailwindcss/oxide and @expo/ngrok-bin all
# ship their prebuilt binary as *optional* dependencies, one per platform
# (e.g. @esbuild/darwin-arm64, @rollup/rollup-win32-x64-msvc). pnpm already
# installs only the optional deps matching the current os/cpu, so no
# per-platform allowlist is needed here — and an explicit one is actively
# harmful: a previous `overrides:` block mapped every non-linux-x64 binary to
# "-", which made `pnpm install` fail on macOS and Windows because the
# toolchain then had no binary to run at all.
#
# `supportedArchitectures` (pnpm >= 10) is the platform-aware mechanism: it
# declares which os/cpu combinations are legitimate install targets, so the
# optional native deps of each are resolved rather than pruned. Keep it
# aligned with what contributors and CI actually use.
# ============================================================================
supportedArchitectures:
  os:
    - current
  cpu:
    - current

overrides:
  # drizzle-kit uses esbuild internally on an older version that's vulnerable, this overrides it
  "@esbuild-kit/esm-loader": "npm:tsx@^4.21.0"
  esbuild: "0.27.3"

allowBuilds:
  core-js: true
  cpu-features: true
  esbuild: false
  protobufjs: true
  sharp: true
  ssh2: true
  workerd: true
