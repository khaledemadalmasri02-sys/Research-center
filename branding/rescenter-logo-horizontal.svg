<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 180" role="img" aria-label="ResCenter horizontal lockup">
  <title>ResCenter — holographic horizontal lockup</title>
  <defs>
    <linearGradient id="hTile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#022C22"/>
      <stop offset="55%"  stop-color="#0F2A2E"/>
      <stop offset="100%" stop-color="#0A1F2A"/>
    </linearGradient>
    <pattern id="hGrid" x="0" y="0" width="14" height="14" patternUnits="userSpaceOnUse">
      <path d="M14 0 H0 V14" fill="none" stroke="#14B8A6" stroke-opacity="0.22" stroke-width="0.5"/>
    </pattern>
    <radialGradient id="hVignette" cx="0.5" cy="0.6" r="0.75">
      <stop offset="60%"  stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.85"/>
    </radialGradient>
    <radialGradient id="hGlow" cx="0.5" cy="0.5" r="0.55">
      <stop offset="0%"   stop-color="#2DD4BF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0F766E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hCyl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#0F766E"/>
      <stop offset="25%"  stop-color="#5EEAD4"/>
      <stop offset="55%"  stop-color="#A7F3D0"/>
      <stop offset="80%"  stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#042F2E"/>
    </linearGradient>
    <radialGradient id="hTop" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0%" stop-color="#ECFEFF"/>
      <stop offset="55%" stop-color="#5EEAD4"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </radialGradient>
    <radialGradient id="hMid" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#0E7490"/>
    </radialGradient>
    <radialGradient id="hNuc" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#ECFEFF"/>
      <stop offset="40%"  stop-color="#5EEAD4"/>
      <stop offset="100%" stop-color="#0F766E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#5EEAD4" stop-opacity="0.18"/>
      <stop offset="50%"  stop-color="#0EA5E9" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="hGlowF" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="hSh" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="5" result="o"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Icon tile -->
  <g transform="translate(20,20)" filter="url(#hSh)">
    <rect x="0" y="0" width="140" height="140" rx="28" fill="url(#hTile)"/>
    <rect x="0" y="0" width="140" height="140" rx="28" fill="url(#hGrid)" opacity="0.7"/>
    <rect x="0" y="0" width="140" height="140" rx="28" fill="url(#hVignette)"/>
    <rect x="0.5" y="0.5" width="139" height="139" rx="27.5" fill="none"
          stroke="#5EEAD4" stroke-opacity="0.35" stroke-width="1"/>

    <!-- reticle -->
    <g filter="url(#hGlowF)">
      <circle cx="70" cy="70" r="58" fill="url(#hGlow)"/>
      <g stroke="#5EEAD4" fill="none" stroke-linecap="round">
        <circle cx="70" cy="70" r="52" stroke-width="1" opacity="0.5"/>
        <circle cx="70" cy="70" r="36" stroke-width="1.2" opacity="0.85"/>
        <line x1="70" y1="14"  x2="70" y2="28" stroke-width="1.2"/>
        <line x1="70" y1="112" x2="70" y2="126" stroke-width="1.2"/>
        <line x1="14"  y1="70" x2="28"  y2="70" stroke-width="1.2"/>
        <line x1="112" y1="70" x2="126" y2="70" stroke-width="1.2"/>
      </g>
      <circle cx="70" cy="70" r="2" fill="#A7F3D0"/>
    </g>

    <!-- glass slice panels -->
    <g transform="translate(16,38) rotate(-8)" filter="url(#hGlowF)">
      <rect x="0" y="0" width="32" height="44" rx="4" fill="url(#hGlass)"
            stroke="#5EEAD4" stroke-opacity="0.6" stroke-width="0.8"/>
      <g stroke="#A7F3D0" stroke-width="0.6" fill="none" opacity="0.85">
        <ellipse cx="16" cy="11" rx="5" ry="4"/>
        <path d="M16 15 V33 M12 21 H20 M11 18 L9 15 M21 18 L23 15 M12 33 L10 40 M20 33 L22 40"/>
      </g>
    </g>
    <g transform="translate(34,36) rotate(-3)" filter="url(#hGlowF)">
      <rect x="0" y="0" width="32" height="44" rx="4" fill="url(#hGlass)"
            stroke="#5EEAD4" stroke-opacity="0.7" stroke-width="0.8"/>
      <g stroke="#A7F3D0" stroke-width="0.6" fill="none" opacity="0.9">
        <ellipse cx="16" cy="11" rx="5" ry="4"/>
        <path d="M16 15 V33 M12 21 H20 M11 18 L9 15 M21 18 L23 15 M12 33 L10 40 M20 33 L22 40"/>
      </g>
    </g>

    <!-- cylinder -->
    <g filter="url(#hGlowF)">
      <path d="M82 56 V92 a25 8 0 0 0 50 0 V56 Z" fill="url(#hCyl)"/>
      <ellipse cx="107" cy="92" rx="25" ry="8" fill="#042F2E"/>
      <path d="M82 75 a25 8 0 0 0 50 0 a25 8 0 0 0 -50 0"
            fill="url(#hMid)" opacity="0.85"/>
      <ellipse cx="107" cy="75" rx="25" ry="8" fill="none"
               stroke="#0F766E" stroke-width="0.6" opacity="0.6"/>
      <path d="M82 66 a25 8 0 0 0 50 0 a25 8 0 0 0 -50 0"
            fill="url(#hMid)" opacity="0.55"/>
      <ellipse cx="107" cy="56" rx="25" ry="8" fill="url(#hTop)"/>
      <ellipse cx="107" cy="56" rx="25" ry="8" fill="none"
               stroke="#0F766E" stroke-width="0.6" opacity="0.7"/>
      <ellipse cx="100" cy="54" rx="10" ry="2.5" fill="#FFFFFF" opacity="0.55"/>
    </g>

    <!-- orbit -->
    <g transform="translate(0,4)" filter="url(#hGlowF)">
      <path d="M82 96 a25 9 0 0 1 50 0" fill="none"
            stroke="#0F766E" stroke-width="1.4" opacity="0.6"/>
      <path d="M82 96 a25 9 0 0 0 50 0" fill="none"
            stroke="#5EEAD4" stroke-width="1.7"/>
      <circle cx="129" cy="94" r="2" fill="#ECFEFF"/>
      <circle cx="129" cy="94" r="1.1" fill="#22D3EE"/>
    </g>
    <g transform="translate(0,4)">
      <circle cx="107" cy="96" r="6.5" fill="url(#hNuc)"/>
      <circle cx="107" cy="96" r="3" fill="#A7F3D0"/>
      <circle cx="106" cy="95" r="1.1" fill="#FFFFFF" opacity="0.95"/>
    </g>

    <!-- AI accent -->
    <g transform="translate(120,20)" filter="url(#hGlowF)">
      <circle r="6.5" fill="#5EEAD4" opacity="0.25"/>
      <circle r="4"   fill="#5EEAD4"/>
      <circle r="1.6"  fill="#022C22"/>
      <circle cx="-1" cy="-1" r="0.8" fill="#FFFFFF" opacity="0.95"/>
    </g>
  </g>

  <!-- Wordmark -->
  <g transform="translate(190,0)" fill="#ECFEFF">
    <text x="0" y="100" font-family="Inter, Segoe UI, system-ui, sans-serif"
          font-size="56" font-weight="700" letter-spacing="-2">ResCenter</text>
    <text x="2" y="128" font-family="Inter, Segoe UI, system-ui, sans-serif"
          font-size="12" font-weight="500" letter-spacing="4" fill="#5EEAD4">
      RADIOLOGY RESEARCH DATA PLATFORM
    </text>
  </g>
</svg>