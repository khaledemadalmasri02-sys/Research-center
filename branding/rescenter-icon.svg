<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="ResCenter icon">
  <title>ResCenter icon — holographic radiology</title>
  <defs>
    <!-- Holographic dark tile -->
    <linearGradient id="tileBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#022C22"/>
      <stop offset="55%"  stop-color="#0F2A2E"/>
      <stop offset="100%" stop-color="#0A1F2A"/>
    </linearGradient>

    <!-- Teal/cyan grid lines (holo floor) -->
    <pattern id="grid" x="0" y="0" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M16 0 H0 V16" fill="none" stroke="#14B8A6" stroke-opacity="0.22" stroke-width="0.6"/>
    </pattern>

    <!-- Glow gradient for the reticle -->
    <radialGradient id="reticleGlow" cx="0.5" cy="0.5" r="0.55">
      <stop offset="0%"   stop-color="#2DD4BF" stop-opacity="0.55"/>
      <stop offset="60%"  stop-color="#14B8A6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0F766E" stop-opacity="0"/>
    </radialGradient>

    <!-- Glassy panel gradient (for the floating cards) -->
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#5EEAD4" stop-opacity="0.18"/>
      <stop offset="50%"  stop-color="#0EA5E9" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.55"/>
    </linearGradient>

    <!-- Cylinder gradient (teal holographic) -->
    <linearGradient id="cylBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#0F766E"/>
      <stop offset="25%"  stop-color="#5EEAD4"/>
      <stop offset="55%"  stop-color="#A7F3D0"/>
      <stop offset="80%"  stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#042F2E"/>
    </linearGradient>
    <radialGradient id="cylTop" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0%"   stop-color="#ECFEFF"/>
      <stop offset="55%"  stop-color="#5EEAD4"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </radialGradient>
    <radialGradient id="cylMid" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0%"   stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#0E7490"/>
    </radialGradient>

    <!-- Nucleus glow -->
    <radialGradient id="nucGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#ECFEFF"/>
      <stop offset="40%"  stop-color="#5EEAD4"/>
      <stop offset="100%" stop-color="#0F766E" stop-opacity="0"/>
    </radialGradient>

    <!-- Outer glow -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Soft tile shadow -->
    <filter id="tileShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dx="0" dy="6" result="o"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Vignette mask so the floor fades at the edges -->
    <radialGradient id="vignette" cx="0.5" cy="0.6" r="0.75">
      <stop offset="60%"  stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.85"/>
    </radialGradient>
  </defs>

  <!-- ===== Tile (dark, holographic) ===== -->
  <g filter="url(#tileShadow)">
    <rect x="8" y="8" width="240" height="240" rx="44" fill="url(#tileBg)"/>
    <rect x="8" y="8" width="240" height="240" rx="44" fill="url(#grid)" opacity="0.7"/>
    <rect x="8" y="8" width="240" height="240" rx="44" fill="url(#vignette)"/>
    <!-- bevel highlight -->
    <rect x="8.5" y="8.5" width="239" height="239" rx="43.5" fill="none"
          stroke="#5EEAD4" stroke-opacity="0.35" stroke-width="1"/>
  </g>

  <!-- ===== Holographic scan reticle (glowing) ===== -->
  <g filter="url(#glow)">
    <circle cx="128" cy="128" r="100" fill="url(#reticleGlow)"/>
    <g stroke="#5EEAD4" fill="none" stroke-linecap="round">
      <circle cx="128" cy="128" r="92" stroke-width="1.2" opacity="0.55"/>
      <circle cx="128" cy="128" r="64" stroke-width="1.4" opacity="0.85"/>
      <line x1="128" y1="20"  x2="128" y2="44" stroke-width="1.6"/>
      <line x1="128" y1="212" x2="128" y2="236" stroke-width="1.6"/>
      <line x1="20"  y1="128" x2="44"  y2="128" stroke-width="1.6"/>
      <line x1="212" y1="128" x2="236" y2="128" stroke-width="1.6"/>
    </g>
    <!-- crosshair center dot -->
    <circle cx="128" cy="128" r="3" fill="#A7F3D0"/>
    <circle cx="128" cy="128" r="6" fill="none" stroke="#5EEAD4" stroke-width="1"/>
  </g>

  <!-- ===== Floating glass slice panel (radiology cue) ===== -->
  <g transform="translate(40,72) rotate(-8)" filter="url(#glow)">
    <rect x="0" y="0" width="56" height="78" rx="6" fill="url(#glass)"
          stroke="#5EEAD4" stroke-opacity="0.6" stroke-width="1"/>
    <!-- mini "skeleton" silhouette inside the panel -->
    <g stroke="#A7F3D0" stroke-width="0.9" fill="none" opacity="0.85">
      <ellipse cx="28" cy="20" rx="9" ry="7"/>
      <path d="M28 27 V58 M22 38 H34 M20 33 L17 28 M36 33 L39 28 M22 58 L18 70 M34 58 L38 70"/>
    </g>
    <!-- corner label -->
    <rect x="0" y="62" width="56" height="14" rx="3" fill="#022C22" opacity="0.75"/>
    <text x="28" y="72" text-anchor="middle" fill="#5EEAD4"
          font-family="Inter, system-ui, sans-serif" font-size="7"
          font-weight="600" letter-spacing="2">SLICE 112</text>
  </g>

  <g transform="translate(70,68) rotate(-3)" filter="url(#glow)">
    <rect x="0" y="0" width="56" height="78" rx="6" fill="url(#glass)"
          stroke="#5EEAD4" stroke-opacity="0.7" stroke-width="1.1"/>
    <g stroke="#A7F3D0" stroke-width="0.9" fill="none" opacity="0.9">
      <ellipse cx="28" cy="20" rx="9" ry="7"/>
      <path d="M28 27 V58 M22 38 H34 M20 33 L17 28 M36 33 L39 28 M22 58 L18 70 M34 58 L38 70"/>
    </g>
    <rect x="0" y="62" width="56" height="14" rx="3" fill="#022C22" opacity="0.75"/>
    <text x="28" y="72" text-anchor="middle" fill="#5EEAD4"
          font-family="Inter, system-ui, sans-serif" font-size="7"
          font-weight="600" letter-spacing="2">SLICE 114</text>
  </g>

  <!-- ===== 3D Database cylinder (holographic) ===== -->
  <g filter="url(#glow)">
    <!-- side -->
    <path d="M148 100 V160 a44 14 0 0 0 88 0 V100 Z" fill="url(#cylBody)"/>
    <!-- bottom disc (dark) -->
    <ellipse cx="192" cy="160" rx="44" ry="14" fill="#042F2E" opacity="0.95"/>
    <!-- middle band -->
    <path d="M148 130 a44 14 0 0 0 88 0 a44 14 0 0 0 -88 0"
          fill="url(#cylMid)" opacity="0.85"/>
    <ellipse cx="192" cy="130" rx="44" ry="14" fill="none"
             stroke="#0F766E" stroke-width="0.8" opacity="0.6"/>
    <!-- another band -->
    <path d="M148 115 a44 14 0 0 0 88 0 a44 14 0 0 0 -88 0"
          fill="url(#cylMid)" opacity="0.55"/>
    <!-- top disc -->
    <ellipse cx="192" cy="100" rx="44" ry="14" fill="url(#cylTop)"/>
    <ellipse cx="192" cy="100" rx="44" ry="14" fill="none"
             stroke="#0F766E" stroke-width="0.9" opacity="0.7"/>
    <!-- glossy highlight -->
    <ellipse cx="180" cy="96" rx="18" ry="4" fill="#FFFFFF" opacity="0.55"/>
  </g>

  <!-- ===== Atomic orbit (tilted, glowing) ===== -->
  <g transform="translate(0,8)" filter="url(#glow)">
    <!-- back arc -->
    <path d="M148 168 a44 16 0 0 1 88 0"
          fill="none" stroke="#0F766E" stroke-width="2.4" opacity="0.6"/>
    <!-- front arc -->
    <path d="M148 168 a44 16 0 0 0 88 0"
          fill="none" stroke="#5EEAD4" stroke-width="2.8"/>
    <!-- electron -->
    <circle cx="232" cy="164" r="3.4" fill="#ECFEFF"/>
    <circle cx="232" cy="164" r="1.8" fill="#22D3EE"/>
  </g>

  <!-- ===== Nucleus with glow ===== -->
  <g transform="translate(0,8)">
    <circle cx="192" cy="168" r="11" fill="url(#nucGlow)"/>
    <circle cx="192" cy="168" r="5"  fill="#A7F3D0"/>
    <circle cx="190" cy="166" r="1.8" fill="#FFFFFF" opacity="0.95"/>
  </g>

  <!-- ===== AI corner accent (holographic, like the reference) ===== -->
  <g transform="translate(214,42)" filter="url(#glow)">
    <circle r="11" fill="#5EEAD4" opacity="0.25"/>
    <circle r="6.5" fill="#5EEAD4"/>
    <circle r="2.6" fill="#022C22"/>
    <circle cx="-1.6" cy="-1.6" r="1.3" fill="#FFFFFF" opacity="0.95"/>
  </g>

  <!-- ===== Tiny "scan" tick mark bottom-left (signature detail) ===== -->
  <g transform="translate(28,212)" stroke="#5EEAD4" stroke-width="1" fill="none" opacity="0.8">
    <line x1="0" y1="0" x2="20" y2="0"/>
    <line x1="0" y1="0" x2="0" y2="6"/>
    <line x1="20" y1="0" x2="20" y2="6"/>
  </g>
  <text x="32" y="234" fill="#5EEAD4" font-family="Inter, system-ui, sans-serif"
        font-size="7" font-weight="600" letter-spacing="2" opacity="0.8">SCAN ACTIVE</text>
</svg>