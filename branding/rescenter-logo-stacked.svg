<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" role="img" aria-label="ResCenter stacked logo">
  <title>ResCenter — holographic stacked lockup</title>
  <defs>
    <linearGradient id="sTile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#022C22"/>
      <stop offset="55%"  stop-color="#0F2A2E"/>
      <stop offset="100%" stop-color="#0A1F2A"/>
    </linearGradient>
    <pattern id="sGrid" x="0" y="0" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M16 0 H0 V16" fill="none" stroke="#14B8A6" stroke-opacity="0.22" stroke-width="0.6"/>
    </pattern>
    <radialGradient id="sVignette" cx="0.5" cy="0.6" r="0.75">
      <stop offset="60%"  stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.85"/>
    </radialGradient>
    <radialGradient id="sGlow" cx="0.5" cy="0.5" r="0.55">
      <stop offset="0%"   stop-color="#2DD4BF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0F766E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sCyl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#0F766E"/>
      <stop offset="25%"  stop-color="#5EEAD4"/>
      <stop offset="55%"  stop-color="#A7F3D0"/>
      <stop offset="80%"  stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#042F2E"/>
    </linearGradient>
    <radialGradient id="sTop" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0%" stop-color="#ECFEFF"/>
      <stop offset="55%" stop-color="#5EEAD4"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </radialGradient>
    <radialGradient id="sMid" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#0E7490"/>
    </radialGradient>
    <radialGradient id="sNuc" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#ECFEFF"/>
      <stop offset="40%"  stop-color="#5EEAD4"/>
      <stop offset="100%" stop-color="#0F766E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#5EEAD4" stop-opacity="0.18"/>
      <stop offset="50%"  stop-color="#0EA5E9" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="sGlowF" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sSh" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dx="0" dy="6" result="o"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g transform="translate(60,40)" filter="url(#sSh)">
    <rect x="0" y="0" width="240" height="240" rx="44" fill="url(#sTile)"/>
    <rect x="0" y="0" width="240" height="240" rx="44" fill="url(#sGrid)" opacity="0.7"/>
    <rect x="0" y="0" width="240" height="240" rx="44" fill="url(#sVignette)"/>
    <rect x="0.5" y="0.5" width="239" height="239" rx="43.5" fill="none"
          stroke="#5EEAD4" stroke-opacity="0.35" stroke-width="1"/>

    <g filter="url(#sGlowF)">
      <circle cx="120" cy="120" r="92" fill="url(#sGlow)"/>
      <g stroke="#5EEAD4" fill="none" stroke-linecap="round">
        <circle cx="120" cy="120" r="84" stroke-width="1.1" opacity="0.55"/>
        <circle cx="120" cy="120" r="58" stroke-width="1.3" opacity="0.85"/>
        <line x1="120" y1="18"  x2="120" y2="40" stroke-width="1.4"/>
        <line x1="120" y1="200" x2="120" y2="222" stroke-width="1.4"/>
        <line x1="18"  y1="120" x2="40"  y2="120" stroke-width="1.4"/>
        <line x1="200" y1="120" x2="222" y2="120" stroke-width="1.4"/>
      </g>
      <circle cx="120" cy="120" r="2.5" fill="#A7F3D0"/>
    </g>

    <g transform="translate(36,68) rotate(-8)" filter="url(#sGlowF)">
      <rect x="0" y="0" width="56" height="78" rx="6" fill="url(#sGlass)"
            stroke="#5EEAD4" stroke-opacity="0.6" stroke-width="1"/>
      <g stroke="#A7F3D0" stroke-width="0.9" fill="none" opacity="0.85">
        <ellipse cx="28" cy="20" rx="9" ry="7"/>
        <path d="M28 27 V58 M22 38 H34 M20 33 L17 28 M36 33 L39 28 M22 58 L18 70 M34 58 L38 70"/>
      </g>
      <rect x="0" y="62" width="56" height="14" rx="3" fill="#022C22" opacity="0.75"/>
      <text x="28" y="72" text-anchor="middle" fill="#5EEAD4"
            font-family="Inter, system-ui, sans-serif" font-size="7"
            font-weight="600" letter-spacing="2">SLICE 112</text>
    </g>
    <g transform="translate(64,64) rotate(-3)" filter="url(#sGlowF)">
      <rect x="0" y="0" width="56" height="78" rx="6" fill="url(#sGlass)"
            stroke="#5EEAD4" stroke-opacity="0.7" stroke-width="1.1"/>
      <g stroke="#A7F3D0" stroke-width="0.9" fill="none" opacity="0.9">
        <ellipse cx="28" cy="20" rx="9" ry="7"/>
        <path d="M28 27 V58 M22 38 H34 M20 33 L17 28 M36 33 L39 28 M22 58 L18 70 M34 58 L38 70"/>
      </g>
      <rect x="0" y="62" width="56" height="14" rx="3" fill="#022C22" opacity="0.75"/>
      <text x="28" y="72" text-anchor="middle" fill="#5EEAD4"
            font-family="Inter, system-ui, sans-serif" font-size="7"
            font-weight="600" letter-spacing="2">SLICE 114</text>
    </g>

    <g filter="url(#sGlowF)">
      <path d="M140 94 V196 a40 13 0 0 0 80 0 V94 Z" fill="url(#sCyl)"/>
      <ellipse cx="180" cy="196" rx="40" ry="13" fill="#042F2E"/>
      <path d="M140 130 a40 13 0 0 0 80 0 a40 13 0 0 0 -80 0"
            fill="url(#sMid)" opacity="0.85"/>
      <ellipse cx="180" cy="130" rx="40" ry="13" fill="none"
               stroke="#0F766E" stroke-width="0.7" opacity="0.6"/>
      <path d="M140 112 a40 13 0 0 0 80 0 a40 13 0 0 0 -80 0"
            fill="url(#sMid)" opacity="0.55"/>
      <ellipse cx="180" cy="94" rx="40" ry="13" fill="url(#sTop)"/>
      <ellipse cx="180" cy="94" rx="40" ry="13" fill="none"
               stroke="#0F766E" stroke-width="0.8" opacity="0.7"/>
      <ellipse cx="170" cy="91" rx="16" ry="3.5" fill="#FFFFFF" opacity="0.55"/>
    </g>

    <g transform="translate(0,4)" filter="url(#sGlowF)">
      <path d="M140 204 a40 14 0 0 1 80 0" fill="none"
            stroke="#0F766E" stroke-width="2.2" opacity="0.6"/>
      <path d="M140 204 a40 14 0 0 0 80 0" fill="none"
            stroke="#5EEAD4" stroke-width="2.6"/>
      <circle cx="216" cy="200" r="3.2" fill="#ECFEFF"/>
      <circle cx="216" cy="200" r="1.7" fill="#22D3EE"/>
    </g>
    <g transform="translate(0,4)">
      <circle cx="180" cy="204" r="10" fill="url(#sNuc)"/>
      <circle cx="180" cy="204" r="4.6" fill="#A7F3D0"/>
      <circle cx="178" cy="202" r="1.7" fill="#FFFFFF" opacity="0.95"/>
    </g>

    <g transform="translate(204,42)" filter="url(#sGlowF)">
      <circle r="10" fill="#5EEAD4" opacity="0.25"/>
      <circle r="6" fill="#5EEAD4"/>
      <circle r="2.4" fill="#022C22"/>
      <circle cx="-1.5" cy="-1.5" r="1.2" fill="#FFFFFF" opacity="0.95"/>
    </g>
  </g>

  <g text-anchor="middle">
    <text x="180" y="324" font-family="Inter, Segoe UI, system-ui, sans-serif"
          font-size="34" font-weight="700" letter-spacing="-1.5" fill="#ECFEFF">ResCenter</text>
    <text x="180" y="346" font-family="Inter, Segoe UI, system-ui, sans-serif"
          font-size="10" font-weight="500" letter-spacing="4" fill="#5EEAD4">
      RADIOLOGY RESEARCH DATA PLATFORM
    </text>
  </g>
</svg>